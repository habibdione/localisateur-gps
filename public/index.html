<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localisateur GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="dot"></span>
        <h1>Localisateur GPS</h1>
      </div>

      <div class="search">
        <div class="search-row">
          <input id="q" type="tel" inputmode="tel" placeholder="Numéro de téléphone" autocomplete="off">
          <button id="go">Localiser</button>
        </div>
        <p class="hint">Tapez le numéro de l'appareil enregistré, ex. <b>77 123 45 67</b></p>
        <p class="err" id="err"></p>
      </div>

      <div class="scroll">
        <div id="result"></div>

        <div id="list-wrap" hidden>
          <p class="section-title">Mes appareils</p>
          <div id="list"></div>
        </div>

        <div id="setup" hidden>
          <p class="section-title">Ajouter ce téléphone</p>
          <div class="card">
            <p class="hint" style="margin-top:0">
              Ouvrez ce lien <b>sur le téléphone à suivre</b>, saisissez son numéro
              et touchez « Démarrer le suivi ».
            </p>
            <div class="actions">
              <a class="btn" id="tracker-link" href="#" target="_blank" rel="noopener">Ouvrir la page téléphone</a>
              <button class="ghost" id="copy-link">Copier le lien</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
